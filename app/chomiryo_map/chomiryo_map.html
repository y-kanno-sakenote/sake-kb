 for(const [p,[q,r]] of Object.entries(TILES)){const [v,dark]=colorOf(p);const cx=MX+q*HW,cy=MY+r*VS;

  const txt=lines.map((t,i)=>`<tspan x="${cx.toFixed(1)}" dy="${i===0?(lines.length===2?-6:4):13}">${t}</tspan>`).join('');
  out+=`<g><polygon class="tile${p===sel?' sel':''}" tabindex="0" role="button" aria-label="${p}" data-p="${p}" points="${hex(cx,cy,R-1.5)}" fill="${css(v)}"></polygon><text class="lbl${dark?' onDark':''}" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle">${txt}</text></g>`;}
 svg.innerHTML=out;
 svg.querySelectorAll('.tile').forEach(r=>{r.addEventListener('click',()=>{sel=r.dataset.p;draw();panel();});r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel=r.dataset.p;draw();panel();}});});

 document.getElementById('note').innerHTML=`<p>${L.note}</p>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function panel(){const d=DATA[sel];let h=`<p class="kicker">${LAYERS.find(l=>l.id===layer).name}</p><h2>${sel}</h2>`;
 if(layer==='shoyu'){const s=d.shoyu;h+=`<p class="fact">${s.total?`出荷 ${s.total.toLocaleString()} kL`:'出荷なし'}</p><div class="num"><b>こいくち</b><span>${s.koi}%</span><b>うすくち</b><span>${s.usu}%</span><b>たまり</b><span>${s.tamari}%</span><b>さいしこみ</b><span>${s.sai}%</span><b>しろ</b><span>${s.shiro}%</span></div><p class="src">醤油の統計資料 2024年実績 シート2.(3)</p>`;}
 else if(layer==='ama'){const a=d.amakuchi;if(!a.refs.length)h+=`<p class="fact">記述なし</p>`;else a.refs.forEach(r=>{h+=`<p class="fact">${esc(r.fact)}</p>${r.scope&&!(r.scope.includes(sel))?`<p class="src">「${esc(r.scope)}」としての記述</p>`:''}<p class="quote">${esc(r.quote)}</p><p class="src">${esc(r.src)}</p>`;});}
 else if(layer==='seishu'){const s=d.seishu;if(!s)h+=`<p class="fact">データなし（点数が少なく非公表）</p>`;else h+=`<p class="fact">甘辛度 ${s.amakara.toFixed(2)}<span style="font-weight:400;color:var(--ink2)">（全国 −0.10）</span></p><div class="num"><b>調査点数</b><span>${s.n}</span><b>アルコール分</b><span>${s.alc.toFixed(2)}%</span><b>日本酒度</b><span>${s.smv>0?'+':''}${s.smv.toFixed(1)}</span><b>総酸</b><span>${s.acid.toFixed(2)}</span><b>アミノ酸度</b><span>${s.amino.toFixed(2)}</span><b>濃淡度</b><span>${s.notan.toFixed(2)}</span></div><p class="src">全国市販酒類調査 平成29年度 参考資料①（一般酒・トリム平均）</p>`;}
 else{const m=d.miso;h+=`<p class="fact">${esc(m.fact)}</p>${m.quote?`<p class="quote">${esc(m.quote)}</p>`:''}${m.src?`<p class="src">${esc(m.src)}</p>`:''}`;}
 document.getElementById('panel').innerHTML=h;}
function tabs(){document.getElementById('tabs').innerHTML=LAYERS.map(l=>`<button class="tab" role="tab" aria-selected="${l.id===layer}" data-l="${l.id}">${l.name}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{layer=b.dataset.l;tabs();draw();panel();}));}
tabs();draw();panel();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{draw();});
</script>
