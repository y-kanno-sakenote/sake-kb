 {id:'miso',name:'味噌の原料',legend:[['米味噌','--kome'],['麦味噌','--mugi'],['豆味噌','--mame'],['米麦調合','--chogo'],['記述なし・断定できず','--none']],
  note:'出典: 日本醸造協会誌（1988〜2023年の県別記述）と『47都道府県・伝統調味料百科』ほか。1980〜90年代の生産構成を根拠にした県が多く、現在の分布そのものではありません。県別の味噌種類を数値で示す統計は見つかっていません。'},
 {id:'seishu',name:'清酒の甘辛',legend:[['辛口寄り','--k2'],['やや辛口','--k1'],['全国並み','--k0'],['やや甘口','--a1'],['甘口寄り','--a2'],['データなし','--none']],
  note:'出典: 国税庁「全国市販酒類調査の結果について 平成29年度調査分」参考資料① 一般酒の成分分析等結果（平均値・県別）。甘辛度は国税庁の指標で、報告書の注記どおり大きいほど甘口。全国平均 −0.10 を基準に、±0.05 を全国並み、±0.30 を超えると寄り、としています。市販の一般酒を県ごとに数点〜二十数点集めたトリム平均で、県別表が付く最後の年度です。宮崎・鹿児島・沖縄は点数が少なく非公表。'},
 {id:'local',name:'地域の調味料',legend:[['〜6件','--l1'],['〜10件','--l2'],['〜14件','--l3'],['15件〜','--l4']],
  note:'出典: 『47都道府県・伝統調味料百科』『伝統食百科』『発酵文化百科』（丸善出版）に載る、その県の調味料の名前と一言。魚醤・味噌・醤油・酢・みりん・酒・塩・たれ・つゆ・だしに絞り、企業名だけの項目と料理・加工品（塩焼き・味噌汁・漬物など）は外しています。件数は本の記述量で、地域の豊かさそのものではありません。'}];
let layer='shoyu', sel='徳島';
const isDark=()=>document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function colorOf(p){const d=DATA[p];
 if(layer==='shoyu'){const s=d.shoyu;if(!s||!s.total)return['--none',false];if(s.tamari>=5)return['--tamari',true];if(s.usu>=20)return['--usu',false];if(s.shiro>=1)return['--shiro',false];return['--koi',true];}
 if(layer==='ama'){const l=d.amakuchi.level;return l===2?['--ama2',true]:l===1?['--ama1',isDark()]:['--ama0',false];}
 if(layer==='local'){const n=(d.local||[]).length;return n<=6?['--l1',false]:n<=10?['--l2',false]:n<=14?['--l3',false]:['--l4',true];}
 if(layer==='seishu'){const s=d.seishu;if(!s)return['--none',false];const v=s.amakara-(-0.10);return v<=-0.30?['--k2',true]:v<-0.05?['--k1',isDark()]:v<=0.05?['--k0',false]:v<0.30?['--a1',isDark()]:['--a2',true];}
 const b=d.miso.base;return b==='米'?['--kome',false]:b==='麦'?['--mugi',true]:b==='豆'?['--mame',true]:b==='調合'?['--chogo',false]:['--none',false];}
function draw(){const svg=document.getElementById('map');const R=33,HW=Math.sqrt(3)/2*R,VS=1.5*R,MX=44,MY=40;let out='';
 const hex=(cx,cy,r)=>[0,1,2,3,4,5].map(i=>{const a=Math.PI/180*(60*i-90);return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);}).join(' ');
 for(const [p,[q,r]] of Object.entries(TILES)){const [v,dark]=colorOf(p);const cx=MX+q*HW,cy=MY+r*VS;
  const lines=p.length>=3?[p.slice(0,2),p.slice(2)]:[p];
  const txt=lines.map((t,i)=>`<tspan x="${cx.toFixed(1)}" dy="${i===0?(lines.length===2?-6:4):13}">${t}</tspan>`).join('');
  out+=`<g><polygon class="tile${p===sel?' sel':''}" tabindex="0" role="button" aria-label="${p}" data-p="${p}" points="${hex(cx,cy,R-1.5)}" fill="${css(v)}"></polygon><text class="lbl${dark?' onDark':''}" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle">${txt}</text></g>`;}
 svg.innerHTML=out;
 svg.querySelectorAll('.tile').forEach(r=>{r.addEventListener('click',()=>{sel=r.dataset.p;draw();panel();});r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel=r.dataset.p;draw();panel();}});});
 const L=LAYERS.find(l=>l.id===layer);
 document.getElementById('legend').innerHTML=L.legend.map(([t,v])=>`<span><i class="sw" style="background:${css(v)}"></i>${t}</span>`).join('');
 document.getElementById('note').innerHTML=`<p>${L.note}</p>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function panel(){const d=DATA[sel];let h=`<p class="kicker">${LAYERS.find(l=>l.id===layer).name}</p><h2>${sel}</h2>`;
 if(layer==='shoyu'){const s=d.shoyu;h+=`<p class="fact">${s.total?`出荷 ${s.total.toLocaleString()} kL`:'出荷なし'}</p><div class="num"><b>こいくち</b><span>${s.koi}%</span><b>うすくち</b><span>${s.usu}%</span><b>たまり</b><span>${s.tamari}%</span><b>さいしこみ</b><span>${s.sai}%</span><b>しろ</b><span>${s.shiro}%</span></div><p class="src">醤油の統計資料 2024年実績 シート2.(3)</p>`;}
 else if(layer==='ama'){const a=d.amakuchi;if(!a.refs.length)h+=`<p class="fact">記述なし</p>`;else a.refs.forEach(r=>{h+=`<p class="fact">${esc(r.fact)}</p>${r.scope&&!(r.scope.includes(sel))?`<p class="src">「${esc(r.scope)}」としての記述</p>`:''}<p class="quote">${esc(r.quote)}</p><p class="src">${esc(r.src)}</p>`;});}
 else if(layer==='local'){const L=d.local||[];let cat='';L.forEach(r=>{if(r.cat!==cat){cat=r.cat;h+=`<p class="kicker cat" style="margin-top:12px">${cat}</p>`;}h+=`<div class="item"><b>${esc(r.name)}</b><span>${esc(r.fact)}<i>（${esc(r.src.replace('伝統調味料百科','調味料百科'))}）</i></span></div>`;});}
 else if(layer==='seishu'){const s=d.seishu;if(!s)h+=`<p class="fact">データなし（点数が少なく非公表）</p>`;else h+=`<p class="fact">甘辛度 ${s.amakara.toFixed(2)}<span style="font-weight:400;color:var(--ink2)">（全国 −0.10）</span></p><div class="num"><b>調査点数</b><span>${s.n}</span><b>アルコール分</b><span>${s.alc.toFixed(2)}%</span><b>日本酒度</b><span>${s.smv>0?'+':''}${s.smv.toFixed(1)}</span><b>総酸</b><span>${s.acid.toFixed(2)}</span><b>アミノ酸度</b><span>${s.amino.toFixed(2)}</span><b>濃淡度</b><span>${s.notan.toFixed(2)}</span></div><p class="src">全国市販酒類調査 平成29年度 参考資料①（一般酒・トリム平均）</p>`;}
 else{const m=d.miso;h+=`<p class="fact">${esc(m.fact)}</p>${m.quote?`<p class="quote">${esc(m.quote)}</p>`:''}${m.src?`<p class="src">${esc(m.src)}</p>`:''}`;}
 document.getElementById('panel').innerHTML=h;}
function tabs(){document.getElementById('tabs').innerHTML=LAYERS.map(l=>`<button class="tab" role="tab" aria-selected="${l.id===layer}" data-l="${l.id}">${l.name}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{layer=b.dataset.l;tabs();draw();panel();}));}
tabs();draw();panel();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{draw();});
</script>
